name: Frontend - Testes

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  testes:
    name: Executar testes Vitest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes e verificar cobertura
        run: npm run test:coverage

      - name: Verificar build do frontend
        run: npm run build