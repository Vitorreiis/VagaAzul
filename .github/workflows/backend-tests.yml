name: Backend - Testes

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  testes:
    name: Executar testes Maven
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Dar permissao ao Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes
        run: ./mvnw --batch-mode clean test -Dspring.profiles.active=test